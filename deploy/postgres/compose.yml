services:
  postgres:
    image: postgres:17
    container_name: postgres-funnel-tracking
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "10.0.1.42:5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
